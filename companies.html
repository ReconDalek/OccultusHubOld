<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Companies | Occultus Hub</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">

</head>

<body>

  <div class="background-overlay"></div>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="nav-left">

      <div class="logo-container">
        <h1 class="logo-text">OCCULTUS</h1>

        <span class="logo-subtitle">
          The Inner Sanctum
        </span>
      </div>

    </div>

    <div class="nav-center"></div>

    <div class="nav-right">

      <div
        id="welcomeContainer"
        class="welcome-container hidden"
      >

        <span id="welcomeText"></span>

        <button
          id="logoutBtn"
          class="logout-btn"
        >
          Logout
        </button>

      </div>

      <button
        id="loginBtn"
        class="login-btn"
      >
        Member Login
      </button>

    </div>

  </nav>

  <!-- HERO -->
  <section
    class="hero-section"
    style="min-height: 40vh;"
  >

    <div class="hero-content">

      <h1 class="hero-title">
        Occultus Companies
      </h1>

      <p class="hero-description">
        Industry powers the collective.<br>
        Every enterprise strengthens the order.
      </p>

    </div>

  </section>

  <!-- CACHE STATUS -->
  <section class="faction-section">

    <div
      id="companyLastUpdated"
      class="quote-box"
      style="margin-bottom: 20px;"
    >
      Loading company cache...
    </div>

  </section>

  <!-- COMPANY GRID -->
  <section class="faction-section">

    <div
      id="companyGrid"
      class="faction-grid"
    ></div>

  </section>

  <!-- QUOTE -->
  <section class="quote-section">

    <div class="quote-box">
      <p id="rotatingQuote"></p>
    </div>

  </section>

  <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal hidden">

    <div class="modal-content">

      <button
        id="closeModal"
        class="close-btn"
      >
        ×
      </button>

      <h2>Member Authentication</h2>

      <p class="modal-description">
        Enter your Torn API key to access the inner sanctum.
      </p>

      <input
        type="password"
        id="apiKeyInput"
        placeholder="Enter Torn API Key"
      />

      <button
        id="submitLogin"
        class="submit-btn"
      >
        Authenticate
      </button>

      <div id="loginStatus"></div>

    </div>

  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="js/companies.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Occultus Leadership</title>

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <div class="background-overlay"></div>

  <!-- NAVBAR -->
  <nav class="navbar">

    <div class="nav-left">
      <div class="logo-container">
        <h1 class="logo-text">OCCULTUS</h1>
        <span class="logo-subtitle">The Inner Sanctum</span>
      </div>
    </div>

    <div class="nav-center"></div>

    <div class="nav-right">

      <!-- MEMBER CARD -->
      <div
        id="memberCardContainer"
        class="member-card-container hidden"
      >
        <button id="memberCardBtn" class="member-card-btn">
          <img
            id="memberAvatar"
            class="member-avatar"
            src=""
            alt="Member Avatar"
          />
        </button>

        <div id="memberDropdown" class="member-dropdown hidden">

          <div class="member-header">

            <img
              id="memberDropdownAvatar"
              class="member-dropdown-avatar"
              src=""
              alt="Member Avatar"
            />

            <div>
              <div id="memberName"></div>
              <div id="memberRole"></div>
              <div id="memberFaction"></div>
            </div>

          </div>

          <div class="member-actions">
            <button id="logoutBtn" class="logout-btn">Logout</button>
          </div>

        </div>
      </div>

      <!-- LOGIN BUTTON (ONLY ONE) -->
      <button id="loginBtn" class="login-btn">
        Member Login
      </button>

    </div>

  </nav>

  <!-- PAGE -->
  <main class="container">

    <h1 class="section-title">Leadership Dashboard</h1>

    <div id="accessDenied" class="quote-box" style="display:none;">
      Access Restricted — Leadership Clearance Required
    </div>

    <div id="dashboard" style="display:none;">

      <!--
      <div class="faction-card">
        <h3>Active Factions</h3>
        <ul>
          <li>Occultus (33097)</li>
          <li>Occul2us (9728)</li>
          <li>Occul3us (9171)</li>
        </ul>
      </div>
      -->
      
      <div class="faction-card" style="margin-top:30px;">
        <h3>Command Controls</h3>

        <button class="primary-btn">Member Activity</button>
        <button class="primary-btn">War Status</button>
        <button class="primary-btn">Internal Notices</button>
      </div>

    </div>

  </main>

  <!-- QUOTE -->
  <section class="quote-section">

    <div class="quote-box">
        <p id="rotatingQuote"></p>
    </div>

  </section>

    <!-- LOGIN MODAL -->
  <div id="loginModal" class="modal hidden">

    <div class="modal-content">

      <button id="closeModal" class="close-btn">  ×</button>

      <h2>Member Authentication</h2>
      <p class="modal-description">
        Enter your Torn API key to access the inner sanctum.
      </p>

      <input
        type="password"
        id="apiKeyInput"
        placeholder="Enter Torn API Key"
      />

      <button  id="submitLogin"  class="submit-btn">  Authenticate</button>

      <div id="loginStatus"></div>

    </div>

  </div>

  <!-- SCRIPTS -->
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/access.js"></script>
  <script src="js/app.js"></script>
  <script src="js/leadership.js"></script>

</body>
</html>
